<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title id="website-title">Happy Birthday</title>
    <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="background">
        <div class="info">
            <img src="img/background.jpg" alt="background.jpg">
            <div class="left-box"></div>
            <div class="right-box"></div>
            <div class="time">
                <h2 class="title">距离 <span id="countdown-name" class="countdown-name"></span> 的生日还有</h2>
                <div class="time-box">
                    <div class="days">
                        <p class="day">00</p>
                        <span class="text">days</span>
                    </div>
                    <div class="hours">
                        <p class="hour">00</p>
                        <span class="text">hours</span>
                    </div>
                    <div class="min">
                        <p class="min">00</p>
                        <span class="text">min</span>
                    </div>
                    <div class="sec">
                        <p class="sec">00</p>
                        <span class="text">sec</span>
                    </div>
                </div>
                <p class="sub-title" id="homepage-text1"></p>
                <p class="sub-title" id="homepage-text2"></p>
                <p class="sub-title tips"></p>
            </div>
        </div>

        <div id="demo-mode-container" class="demo-mode-container"
            style="display: none; position: fixed; top: 20px; right: 20px; z-index: 1000; background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px;">
            <div class="demo-mode-text" style="color: #ffffff; font-size: 14px; margin-right: 15px; font-weight: bold;">
                当前为演示模式</div>
            <button id="demo-test-20s-btn" title="将生日时间设为20秒后，查看整体效果" onclick="demoTest20s()"
                style="background: #ff4081; color: #ffffff; border: none; border-radius: 14px; padding: 6px 12px; font-size: 13px; font-weight: bold; cursor: pointer; margin-right: 10px;">20秒测试</button>
            <div class="demo-icons" style="display: flex; align-items: center;">
                <a id="github-icon" href="#" target="_blank" title="GitHub"
                    style="color: #ffffff; font-size: 18px; margin-right: 10px;">
                    <i class="fab fa-github"></i>
                </a>
                <a id="settings-icon" href="#" title="设置" style="color: #ffffff; font-size: 18px;">
                    <i class="fas fa-cog"></i>
                </a>
            </div>
        </div>
    </div>
</body>

<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="script/index.js"></script>
<script>
    function demoTest20s() {
        var now = new Date();
        var target = new Date(now.getTime() + 20000);
        var pad = function (n) { return n < 10 ? '0' + n : n; };
        var targetStr =
            target.getFullYear() + '-' +
            pad(target.getMonth() + 1) + '-' +
            pad(target.getDate()) + ' ' +
            pad(target.getHours()) + ':' +
            pad(target.getMinutes()) + ':' +
            pad(target.getSeconds());
        var key = 'birthdayConfig';
        var storedRaw = localStorage.getItem(key);
        var localData = null;
        if (storedRaw) {
            try { localData = JSON.parse(storedRaw); } catch (e) { localData = null; }
        }
        if (!localData) {
            localData = { name: '', birthdayTime: '', ifHaveGift: true, homepageText1: '', homepageText2: '', blessText: {} };
        }
        localData.birthdayTime = targetStr;
        localStorage.setItem(key, JSON.stringify(localData));
        location.reload();
    }
</script>

</html>
